<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">TILT risk-aware training and scale-conditioned policy schematic</title>
<desc id="desc">A method figure showing dynamics parameters reweighted by entropic risk, a log arm-scale feature concatenated through an MLP, and stochastic scale exposure during training with true scale restored for evaluation.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfa"/><stop offset="1" stop-color="#edf3f1"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#52657b"/></marker>
 <style>
  text{font-family:Inter,Arial,sans-serif;fill:#19373c}.muted{fill:#5f7779}.small{font-size:15px}.label{font-size:16px;font-weight:700;letter-spacing:.035em}.head{font-size:24px;font-weight:700}.math{font-family:Georgia,serif;font-size:21px}.flow{stroke:#52657b;stroke-width:2;fill:none;marker-end:url(#arrow)}.soft{stroke:#71908a;stroke-width:1.5;fill:none;stroke-dasharray:5 6}.box{fill:#fff;stroke:#d3e0dc;stroke-width:1.5}
 </style>
</defs>
<rect width="1200" height="620" rx="24" fill="url(#paper)"/>
<text x="58" y="55" class="label" fill="#174b83">TILT · METHOD SCHEMATIC</text>
<text x="58" y="91" class="head">Risk reweighting and scale-conditioned control</text>
<text x="1142" y="56" text-anchor="end" class="small muted">Architecture diagram · no measured data shown</text>

<!-- top row: adaptive environment distribution -->
<rect x="52" y="125" width="1096" height="154" rx="16" class="box"/>
<text x="78" y="158" class="label">1 · ADAPT THE TRAINING DISTRIBUTION</text>
<g transform="translate(95 180)">
 <text x="0" y="12" class="small muted">Sobol parameter grid θ</text>
 <g fill="#174b83" opacity=".6"><circle cx="15" cy="40" r="4"/><circle cx="45" cy="40" r="4"/><circle cx="75" cy="40" r="4"/><circle cx="105" cy="40" r="4"/><circle cx="15" cy="68" r="4"/><circle cx="45" cy="68" r="4"/><circle cx="75" cy="68" r="4"/><circle cx="105" cy="68" r="4"/></g>
</g>
<path d="M259 220H321" class="flow"/>
<rect x="336" y="180" width="192" height="78" rx="10" fill="#f2f7f5" stroke="#cddbd7"/>
<text x="432" y="208" text-anchor="middle" class="label">Policy evaluation</text>
<text x="432" y="235" text-anchor="middle" class="small muted">return R(θ)</text>
<path d="M536 220H598" class="flow"/>
<rect x="613" y="180" width="253" height="78" rx="10" fill="#f2f7f5" stroke="#cddbd7"/>
<text x="739" y="207" text-anchor="middle" class="math">q(θ) ∝ exp(−β R(θ))</text>
<text x="739" y="235" text-anchor="middle" class="small muted">dual β controls KL(q ‖ uniform)</text>
<path d="M874 220H936" class="flow"/>
<g transform="translate(962 181)">
 <text x="0" y="12" class="small muted">Next PPO round</text>
 <g fill="#174b83" opacity=".45"><circle cx="15" cy="42" r="3"/><circle cx="46" cy="42" r="3"/><circle cx="88" cy="42" r="3"/></g>
 <g fill="#c8313e"><circle cx="37" cy="66" r="5"/><circle cx="52" cy="54" r="5"/><circle cx="67" cy="70" r="5"/><circle cx="82" cy="58" r="5"/><circle cx="97" cy="74" r="5"/></g>
 <text x="0" y="101" class="small muted">emphasize difficult θ</text>
</g>

<!-- bottom-left: scale exposure -->
<rect x="52" y="309" width="416" height="260" rx="16" class="box"/>
<text x="78" y="344" class="label">2 · RANDOMIZE ARM SCALE</text>
<path d="M94 480H211" class="axis"/>
<path d="M94 480V382" class="axis"/>
<text x="212" y="500" class="small muted">scale L/L₀</text>
<text x="83" y="378" class="small muted">p(θ)</text>
<path d="M96 473c25-2 30-15 47-39 19-28 25-41 39-42 17-1 22 21 30 43 8 24 15 37 33 39" fill="none" stroke="#174b83" stroke-width="3"/>
<path d="M96 473c25-2 30-15 47-39 19-28 25-41 39-42 17-1 22 21 30 43 8 24 15 37 33 39" fill="#174b83" opacity=".08"/>
<path d="M103 454 252 390" class="soft"/>
<text x="278" y="393" class="math">xₛ = log(L/L₀)</text>
<text x="278" y="421" class="small muted">appended to policy input</text>
<rect x="277" y="445" width="152" height="63" rx="10" fill="#f3f7f5" stroke="#cddbd7"/>
<text x="353" y="470" text-anchor="middle" class="label">SSE mask</text>
<text x="353" y="492" text-anchor="middle" class="small muted">keep p = 0.9 in training</text>

<!-- bottom-right: scale concat network -->
<rect x="492" y="309" width="656" height="260" rx="16" class="box"/>
<text x="518" y="344" class="label">3 · CONCATENATE SCALE THROUGH THE MLP</text>
<g>
 <rect x="524" y="385" width="110" height="72" rx="9" fill="#f3f7f5" stroke="#cddbd7"/>
 <text x="579" y="414" text-anchor="middle" class="label">obs x</text>
 <text x="579" y="438" text-anchor="middle" class="small muted">state features</text>
 <rect x="524" y="477" width="110" height="55" rx="9" fill="#fff4e6" stroke="#e6c99d"/>
 <text x="579" y="500" text-anchor="middle" class="label">xₛ</text>
 <text x="579" y="520" text-anchor="middle" class="small muted">scale</text>
 <path d="M636 420H681" class="flow"/>
 <path d="M636 504 659 504 659 448 681 448" class="flow"/>
 <rect x="693" y="392" width="112" height="75" rx="9" fill="#edf5f2" stroke="#c2d7d1"/>
 <text x="749" y="421" text-anchor="middle" class="label">Layer 1</text>
 <text x="749" y="446" text-anchor="middle" class="math">h₁</text>
 <path d="M807 420H851" class="flow"/>
 <path d="M636 504 841 504 841 450 851 450" class="flow"/>
 <rect x="863" y="392" width="112" height="75" rx="9" fill="#edf5f2" stroke="#c2d7d1"/>
 <text x="919" y="421" text-anchor="middle" class="label">Layer 2</text>
 <text x="919" y="446" text-anchor="middle" class="math">h₂</text>
 <path d="M977 429H1010" class="flow"/>
 <rect x="1022" y="392" width="96" height="75" rx="9" fill="#174b83"/>
 <text x="1070" y="423" text-anchor="middle" class="label" fill="#fff">policy</text>
 <text x="1070" y="447" text-anchor="middle" class="math" fill="#fff">a</text>
 <text x="851" y="510" text-anchor="middle" class="small muted">xₛ is concatenated at every layer input</text>
</g>
<text x="820" y="546" text-anchor="middle" class="small muted">At evaluation, the true scale feature is always supplied.</text>
</svg>